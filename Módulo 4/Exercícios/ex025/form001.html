<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>

    <style>

        *{
            font-family: Arial, Helvetica, sans-serif;
        }

        body{
            background-color: rgb(100, 113, 170);
        }

    </style>

</head>
<body>

    <h1>Meu Primeiro Formulário</h1>

    <!--
    
    GET - Situações que os dados não forem sensíveis
    Ex: Nome, Peso, Altura, Coisas simples (Tranquilas de vazar)
    URL é compartilhável

    Post - Situações que os dados forem sensíveis
    Ex: Senha, Dados de Cartão, Fotos, Coisas complexas (Risco de vazar)
    URL não é compartilhável

    -->

    <form action="cadastro.php" method="POST" autocomplete="off">
        <p>
            <label for="inome">Nome:</label> 
            <input type="text" name="nome" id="inome" >
        </p>

        <p>
            <label for="isobrenome">Sobrenome: </label>
            <input type="text" name="sobrenome" id="isobrenome">
        </p>

        <p><input type="submit" value="Enviar"></p>
    </form>

</body>
</html>
