<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>

    <style>

        body{
            font-family: Arial, Helvetica, sans-serif;
        }

    </style>

</head>
<body>

    <h1>Teste de Formulário</h1>

    <form method="get" autocomplete="on" id="formulario">

        <p>
            <label for="inome">Nome: </label>
            <input type="text" name="nome" id="inome" required maxlength="30" placeholder="Nome completo" autocomplete="username">
        </p>

        <p>
            <label for="imedia">Média: </label>
            <input type="number" name="media" id="imedia" required min="0" max="10" placeholder="0 a 10" step="0.5">
        </p>

        <p>
            <label for="imes">Período Letivo: </label>
            <input type="month" name="mes" id="imes" value="2025-05">
        </p>

        <p>
            <label for="idia">Dia da Prova: </label>
            <input type="date" name="dia" id="idia" value="2025-05-15">
        </p>

        <p>
            <label for="ihora">Horário da Prova: </label>
            <input type="time" name="hora" id="ihora" value="10:20">
        </p>

        <p>
            <input type="submit" value="Enviar" onclick="validar(event)">
            <input type="reset" value="Limpar">
        </p>

    </form>
</body>
</html>
