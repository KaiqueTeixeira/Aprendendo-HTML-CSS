<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos de iframe</title>

    <style>

        iframe{
            width: 400px;
            height: 400px;
            border: 5px solid black;
        }

    </style>

</head>
<body>
    
    <h1>Testando o uso de um iframe</h1>
    <p>Acessando o site do 

        <!-- Tamanho padrão do iframe - 300-150 -->
        
        <iframe src="https://www.cursoemvideo.com" frameborder="0" height="500">
            <a href="https://www.cursoemvideo.com" target="_blank">Curso em Video</a>
        </iframe>
        
        Cursoemvideo para aprender a programar.</p>

    <p>O site do <iframe src="https://www.google.com.br" frameborder="0">
        <a href="www.google.com.br" target="_blank">google</a>
    </iframe> também é muito legal, pena que não funciona dentro do iframe</p>

    <p>
        O repositório do Guanabara

        <iframe src="https://gustavoguanabara.github.io" frameborder="0" height="500" width="500" scrolling="auto">
            no <a href="https://gustavoguanabara.github.io" target="_blank">Github</a>
        </iframe>

        também é legal
    </p>
</body>
</html>
