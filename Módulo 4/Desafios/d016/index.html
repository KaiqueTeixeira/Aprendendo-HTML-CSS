<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto Login</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="estilos/style.css">
    <link rel="stylesheet" href="estilos/media-query.css">

</head>
<body>

    <main> 
        <section id="login">

            <div id="imagem">
                
            </div>
            <div id="formulario">
                <h1>Login</h1>
                <p>Seja bem vindo(a) novamente. Faça login para acessar sua conta e poder fazer as configurações no seu ambiente</p>

                <form action="POST" autocomplete="on">
                    <div class="campo">        
                        <i class="material-icons">person</i> 
                        <input type="email" name="usuario" id="iusuario" required placeholder="Seu email" autocomplete="email">
                        <label for="iusuario">Email</label>
                    </div>

                    <div class="campo">
                        <i class="material-icons">lock</i> 
                        <input type="password" required minlength="8" placeholder="Sua senha" autocomplete="current-password">
                        <label for="isenha">Senha</label>
                    </div>

                    <input type="submit" value="Entrar">
                    <input type="button" value="Esqueci a senha" class="butao">  

                </form>
            </div>
        </section>
    </main>
</body>
</html>
