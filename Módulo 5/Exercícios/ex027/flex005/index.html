<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox certralizado</title>

    <style>

        * {
            margin: 0px;
            padding: 0px;
            font-family: Arial, Helvetica, sans-serif;
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
        }

        body {
            background-color: lightsalmon;
        }

        main {
            display: flex;
            flex-flow: row nowrap;
            justify-content: center;
            align-items: center;

            margin: auto;

            height: 100vh;
            width: 80vw;
            background-color: lightgreen;
        }

        section { 
            height: 200px;
            width: 200px;
            background-color: lightseagreen;
        }

    </style>

</head>
<body>
    <h1>Centralização Absoluta com Flex Box</h1>

    <main>

        <section>
            

            <h1>Tela de Login</h1>

        </section>

    </main>
    
</body>
</html>
