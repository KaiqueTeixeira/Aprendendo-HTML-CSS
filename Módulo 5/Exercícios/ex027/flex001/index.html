<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>

    <style>

        body {
            background-color: rgb(175, 175, 175);
        }

        h1 {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 2em;
            border-top: 2px solid black;
            margin-top: 30px;
        }

        .conteiner1 {
            display: flex;
            flex-direction: column;

            background-color: lightcoral;
        }

        .item1 {
            flex: auto;
            padding: 10px;

            text-align: center;
            background-color: lightblue;
            border: 1px solid black;
        }

        .conteiner2 {
            display: flex;
            flex-direction: row;

            background-color: lightcoral;
        }

        .item2 {
            flex: auto;
            padding: 10px;

            text-align: center;
            background-color: lightblue;
            border: 1px solid black;
        }

    </style>

</head>
<body>

    <h1>Column</h1>
    <div class="conteiner1">

        <div class="item1">A</div>
        <div class="item1">B</div>
        <div class="item1">C</div>
        <div class="item1">D</div>
        <div class="item1">E</div>
        <div class="item1">F</div>
        <div class="item1">G</div>

    </div>

    <h1>Row</h1>
    <div class="conteiner2">

        <div class="item2">A</div>
        <div class="item2">B</div>
        <div class="item2">C</div>
        <div class="item2">D</div>
        <div class="item2">E</div>
        <div class="item2">F</div>
        <div class="item2">G</div>

    </div>
    
</body>
</html>
